def calculateVersionCode(String version) {
    if (!version) return 1
    def clean = version.split('-')[0].trim()
    def parts = clean.split('\\.').collect { it.isInteger() ? it.toInteger() : 0 }
    def major = parts.size() > 0 ? parts[0] : 0
    def minor = parts.size() > 1 ? parts[1] : 0
    def patch = parts.size() > 2 ? parts[2] : 0
    return major * 10000 + minor * 100 + patch
}

android {
    namespace 'com.cylonid.nativealpha'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    flavorDimensions "default"
    productFlavors {
        extended {
            dimension "default"
            applicationIdSuffix ".pro"
            resValue "string", "app_name", "Native Alpha +"
        }
        extendedGithub {
            dimension "default"
            resValue "string", "app_name", "Native Alpha"
        }
        standard {
            dimension "default"
            isDefault true
            resValue "string", "app_name", "Native Alpha"
        }
    }

    defaultConfig {
        applicationId "com.cylonid.nativealpha"
        minSdkVersion 28
        targetSdkVersion 35
        versionName "1.6.5" // x-release-please-version
        versionCode calculateVersionCode(versionName)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
        resValues true
    }

    composeCompiler {
        includeComposeMappingFile = false
    }


    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty("KEYSTORE_FILE") ? project.property("KEYSTORE_FILE") : null)
            if (keystoreFile && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty("KEYSTORE_PASSWORD") ? project.property("KEYSTORE_PASSWORD") : "")
                keyAlias System.getenv("KEY_ALIAS") ?: (project.hasProperty("KEY_ALIAS") ? project.property("KEY_ALIAS") : "")
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.hasProperty("KEY_PASSWORD") ? project.property("KEY_PASSWORD") : "")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
            resValue "string", "app_name", "_DEBUG-Native Alpha"
        }
    }

    base {
        archivesName = 'NativeAlpha'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jvmArgs '--enable-native-access=ALL-UNNAMED'
            }
        }
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    lint {
        checkReleaseBuilds true
    }
}

